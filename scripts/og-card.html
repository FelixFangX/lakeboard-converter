<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>ledring tools · Social card</title>
  <style>
    @font-face { font-family: "Instrument Serif"; src: url('../web/public/fonts/instrument-serif-400.woff2') format('woff2'); font-weight: 400; }
    @font-face { font-family: "JetBrains Mono"; src: url('../web/public/fonts/jetbrains-mono-400.woff2') format('woff2'); font-weight: 400; }
    :root { --bg: #ebe7df; --ink: #131211; --dim: #5b564e; --faint: #9c958a; --rule: #d2ccc1; --acc: #23406a; --amber: #e6b54a; font-synthesis: none; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--ink); }
    .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; }
    .frame { position: absolute; inset: 24px; border: 1px solid var(--rule); pointer-events: none; }
    .cross { position: absolute; width: 13px; height: 13px; background: linear-gradient(var(--faint), var(--faint)) center / 13px 1px no-repeat, linear-gradient(var(--faint), var(--faint)) center / 1px 13px no-repeat; }
    .tl { top: -7px; left: -7px; } .tr { top: -7px; right: -7px; }
    .bl { bottom: -7px; left: -7px; } .br { bottom: -7px; right: -7px; }
    .mono { font: 400 16px/1.6 "JetBrains Mono", monospace; letter-spacing: .12em; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .ring { width: 32px; height: 32px; flex: none; }
    h1 { margin: 58px 0 28px; font: 400 112px/.96 "Instrument Serif", Georgia, serif; letter-spacing: -.01em; }
    h1 span { display: block; color: var(--dim); }
    .formats { color: var(--dim); letter-spacing: .04em; white-space: pre; }
    .footer { position: absolute; bottom: 60px; left: 72px; right: 72px; padding-top: 20px; border-top: 1px solid var(--rule); color: var(--dim); font-size: 13px; letter-spacing: .06em; }
  </style>
</head>
<body>
  <main class="card">
    <div class="frame" aria-hidden="true"><i class="cross tl"></i><i class="cross tr"></i><i class="cross bl"></i><i class="cross br"></i></div>
    <div class="brand mono">
      <svg class="ring" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="led" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6b54a"/><stop offset="1" stop-color="#23406a"/></linearGradient></defs>
        <circle cx="16" cy="16" r="12" fill="none" stroke="#d2ccc1" stroke-width="3"/>
        <circle cx="16" cy="16" r="12" fill="none" stroke="url(#led)" stroke-width="3" stroke-dasharray="19 57"/>
      </svg>
      LEDRING / TOOLS
    </div>
    <h1>Mind map,<span>to Markdown.</span></h1>
    <p class="formats mono">.lakeboard  .xmind  →  .md</p>
    <div class="footer mono">CONVERT.LEDRING.DEV · RUNS IN YOUR BROWSER · NOTHING UPLOADED</div>
  </main>
</body>
</html>
